# cargo-audit configuration
# Ref: https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# This file documents why specific RustSec advisories are ignored.
# Each ignore MUST have a `reason` documenting:
#   1. Why the advisory doesn't apply OR why it can't be fixed
#   2. Who depends on the crate (transitive chain)
#   3. When the ignore should be re-evaluated

[advisories]
# Each entry here is a RustSec advisory ID that cargo-audit will not flag.
# CRITICAL: review this list on every `cargo update` and quarterly.
ignore = [
    # RUSTSEC-2024-0449 — unsafe-libyaml 0.2.11 — unmaintained (warning)
    # Root cause: transitive chain limiteron v0.3.0-rc.7 → confers v0.6.0-rc.10
    # (`yaml` feature = `dep:serde_yaml_ng`) → serde_yaml_ng v0.10.0 → unsafe-libyaml.
    # limiteron enables confers' `yaml` feature; the yaml path is never exercised by
    # nebulaid (config loading goes through TOML only), but cargo features are a union —
    # a dependency enabling yaml puts the crate in the graph regardless.
    # Upstream status: fixed in limiteron/confers local HEAD (YAML backend migrated
    # serde_yaml_ng → serde-saphyr, pure Rust), not yet published to crates.io.
    # Cannot be fixed from this repository: no newer published version exists, and
    # feature pruning on our side cannot remove a feature another dependency enables.
    # Re-evaluate: when limiteron/confers publish the serde-saphyr migration
    # (track their CHANGELOGs; drop this entry and re-run `cargo audit`).
    "RUSTSEC-2024-0449",
]

[yanked]
enabled = false
