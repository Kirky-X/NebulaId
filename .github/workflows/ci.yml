name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  # 单包仓库：显式限定 nebulaid 目标包，避免全树扫描
  PKG: nebulaid

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阶段 1：格式 + Lint（任意非零退出码阻断合并）
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-ci"
          cache-targets: false

      - name: Format Check
        run: cargo fmt --package ${{ env.PKG }} -- --check

      - name: Clippy Lint
        # --all-features 可构建：sqlite feature 已删除，dbnexus 的 embedded/server
        # 互斥不再触发；一条命令覆盖 etcd + sdk + alerting + integration-tests。
        run: cargo clippy --package ${{ env.PKG }} --all-features -- -D warnings

      - name: Check no-default-features
        # 轻量编译检查：postgres 驱动可关，garrison 回退路径与 sdforge 镜像
        # feature（http/grpc/openapi）关闭路径全部参与编译，防止 fallback 腐烂。
        # 仅保证编译——core::database 无条件编译，运行时需自备 PostgreSQL。
        run: cargo check --package ${{ env.PKG }} --no-default-features --lib --bins

  # 阶段 2：cargo-deny 检查（许可证 + 安全）
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn

  # 阶段 3：cargo-audit 安全审计
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Audit
        run: cargo audit --deny warnings

  # 阶段 4：多 feature matrix 测试 + 覆盖率门禁（≥95%）
  # all leg（--all-features）覆盖 etcd + sdk + alerting + integration-tests 的
  # 编译与测试；no-default 组合的编译检查在 fmt-clippy job。
  test:
    name: Test (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt-clippy, deny, audit]
    strategy:
      fail-fast: false
      matrix:
        feature:
          - default
          - all
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-ci-${{ matrix.feature }}"
          cache-targets: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Build (feature=${{ matrix.feature }})
        run: |
          if [ "${{ matrix.feature }}" = "all" ]; then
            cargo build --package ${{ env.PKG }} --all-features
          else
            cargo build --package ${{ env.PKG }}
          fi

      # all leg：只验证全特性面的编译与测试执行，不进覆盖率门禁
      # （sdk 代码测试密度低，95% 阈值会挂；与旧独立 sdk job 的策略一致）。
      - name: Run Tests (feature=all)
        if: matrix.feature == 'all'
        run: cargo test --package ${{ env.PKG }} --all-features --no-fail-fast

      # default leg：覆盖率门禁（≥95%）与 Codecov 上报只在 default 跑。
      # --ignore-filename-regex 排除 prost/tonic 生成的 proto 胶水代码：
      # 生成代码无法被单元测试有意义地覆盖（编译器产物），计入覆盖率
      # 只会稀释人工代码的真实覆盖率。main.rs 等手写代码仍全量计入。
      - name: Run Tests with Coverage (feature=default)
        if: matrix.feature == 'default'
        run: cargo llvm-cov --package ${{ env.PKG }} --fail-under-lines 95 --ignore-filename-regex "server/proto/" --lcov --output-path lcov.info

      - name: Upload Coverage Report
        if: always() && matrix.feature == 'default'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.feature }}
          verbose: true

  # 阶段 5：聚合门禁（任一前置 job 失败则阻断合并）
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [fmt-clippy, deny, audit, test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "fmt-clippy: ${{ needs.fmt-clippy.result }}"
          echo "deny:      ${{ needs.deny.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "test:      ${{ needs.test.result }}"
          if [[ "${{ needs.fmt-clippy.result }}" != "success" || \
                "${{ needs.deny.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed - blocking merge"
            exit 1
          fi
          echo "All CI gates passed"
