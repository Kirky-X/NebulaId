name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  # 单包仓库：显式限定 nebulaid 目标包，避免全树扫描
  PKG: nebulaid

concurrency:
  # main 分支不取消在飞运行：发布门禁依赖该提交的完整结论，被取消等于无结论
  # （本轮实测 run 41354606188 在 37 分钟后被外部取消，run_attempt=1，非自我触发）。
  # PR 仍取消旧运行以省额度。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 阶段 1：格式 + Lint（任意非零退出码阻断合并）
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-ci"
          cache-targets: false

      - name: Format Check (workspace)
        # --all：workspace 化后 operator 成员也必须过格式门（此前 --package 只覆盖主 crate，
        # crates/nebulaid-operator 的格式漂移无人拦截）。
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        # --all-features 可构建：sqlite feature 已删除，dbnexus 的 embedded/server
        # 互斥不再触发；一条命令覆盖 etcd + sdk + alerting + integration-tests。
        run: cargo clippy --package ${{ env.PKG }} --all-features -- -D warnings

      - name: Clippy Lint (operator member)
        # 成员级 lint：kube/kube-runtime/k8s-openapi 只进 operator crate，
        # 主 crate 的 clippy 腿看不见它；--all-targets 连测试目标一并钉住。
        run: cargo clippy --package nebulaid-operator --all-targets -- -D warnings

      - name: Check no-default-features
        # 轻量编译检查：postgres 驱动可关，garrison 回退路径与 sdforge 镜像
        # feature（http/grpc/openapi）关闭路径全部参与编译，防止 fallback 腐烂。
        # 模块级特性门控后：core::database/server 随特性编译，本组合
        # （零算法零 DB 零服务端）验证 config/types/i18n/coordinator 裸面；
        # bins 与 server 系集成测试因 required-features 自动跳过，不报空目标错。
        # --tests 一并钉住测试面的门控（防 lib 面干净而 test 面漏网的半门控）。
        run: cargo check --package ${{ env.PKG }} --no-default-features --lib --bins --tests

      - name: Check no-default-features across all targets
        # etcd 进 default 后的轻量目标总钉：--all-targets 把 benches/ 与全部集成测试
        # 一并纳入零 etcd 组合的编译面（上方 --lib --bins --tests 腿漏掉的 bench 目标
        # 曾让 criterion 基准在裁剪组合下静默腐烂）。同时反向证明 etcd.rs 整模块
        # 确实未进编译面：tests/etcd_default_feature.rs 在此组合只编译 not(etcd) 臂。
        run: cargo check --package ${{ env.PKG }} --no-default-features --all-targets

      - name: Check feature trim (uuid-v8 only)
        # 剪裁钉：纯算法嵌入场景的最小组合（core/algorithm 仅 uuid_v8，
        # 依赖树 196 crates vs default 526）。防止越界 use（如 lib 面引用
        # core::database）静默腐烂剪裁能力；--tests 同上钉住测试面。
        run: cargo check --package ${{ env.PKG }} --no-default-features --features uuid-v8 --lib --tests

      - name: Check feature trim (uuid-v5 only)
        # 剪裁钉：v5 确定性派生的最小组合（core/algorithm 仅 uuid_v5，
        # 零 DB 零服务端零其他发号算法）——etyma 的消费形态即此形状。
        # v5 不经 router/AlgorithmType，该组合同时钉住「无任何发号算法时
        # lib 与测试面」的可构建性（sdk 不在场，kit 测试面不参与编译）；
        # --tests 钉住 uuid_v5 自身测试的门控。
        run: cargo check --package ${{ env.PKG }} --no-default-features --features uuid-v5 --lib --tests

      - name: Check sdk with uuid-v5 only
        # sdk + uuid-v5（无 snowflake/uuid-v8/segment）：kit build 在此组合
        # 因无发号算法而显性失败属既定契约（v5-only 消费者走直调路径），
        # 但 lib 与测试面必须编译干净、无半门控测试漏网（kit 测试按
        #[cfg(any(feature = "snowflake", feature = "uuid-v8"))] 门控剔除）。
        run: cargo test --package ${{ env.PKG }} --no-default-features --features sdk,uuid-v5 --lib

      - name: Check server without algorithm features
        # server 不蕴含任何算法特性：钉住 bin 在 server-only 组合下可构建
        # （main.rs 的 segment 专属接线已按 cfg 门控），防止越界引用复发；
        # --tests 同上钉住测试面。
        run: cargo check --package ${{ env.PKG }} --no-default-features --features server --lib --bins --tests

      - name: Check sdk without database
        # sdk 不蕴含 database：仓储面（RepositoryModule/with_repository/
        # has_repository）随 database cfg 门控，纯算法嵌入组合零 DB 编译树。
        # 本钉防止仓储引用越界泄漏回 sdk 无条件编译面使剪裁能力腐烂；
        # snowflake+uuid-v8 覆盖 kit 测试面的算法运行时需要，--tests 钉测试面。
        # test 行钉 Segment 显性拒绝契约的运行时执行（test matrix 两腿均含
        # database，该 not(database) 用例仅此处执行）；sdk,database 组合的
        # 测试面由 test job 的 all 腿与 clippy --all-features 覆盖。
        run: |
          cargo check --package ${{ env.PKG }} --no-default-features --features sdk,snowflake,uuid-v8 --lib --tests
          cargo test --package ${{ env.PKG }} --no-default-features --features sdk,snowflake,uuid-v8 --lib sdk::kit::tests::test_segment_request_rejected_without_database_feature

      - name: Check sdk with uuid-v8 only
        # sdk 零 database 且零 snowflake：纯 uuid-v8 嵌入的最薄算法面。
        # 本钉执行该组合的全量 lib 测试——snowflake 依赖的 kit 测试经
        # #[cfg(feature = "snowflake")] 门控在此面编译剔除（与 database 门控
        # 同款约定），防止测试硬编码算法使组合面出现盲区失败。
        run: cargo test --package ${{ env.PKG }} --no-default-features --features sdk,uuid-v8 --lib

  # 阶段 2：cargo-deny 检查（许可证 + 安全）
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn

  # 阶段 3：cargo-audit 安全审计
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Audit
        run: cargo audit --deny warnings

  # 阶段 4：多 feature matrix 测试 + 覆盖率门禁（≥95%）
  # all leg（--all-features）覆盖 etcd + sdk + alerting + integration-tests 的
  # 编译与测试；no-default 组合的编译检查在 fmt-clippy job。
  test:
    name: Test (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt-clippy, deny, audit]
    strategy:
      fail-fast: false
      matrix:
        feature:
          - default
          - all
    # default leg 的覆盖率采集会真实启动 nebula-id 二进制覆盖 main.rs 组合根，
    # 需 PG + Redis 服务（跑迁移/装载 key/缓存）；两 leg 共享 job，服务对 all leg 无害。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idgen
          POSTGRES_PASSWORD: idgen
          POSTGRES_DB: idgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idgen -d idgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # etcd：etcd 进 default 后协调路径属于默认产物（不再是“只在全特性腿跑”）。
      # 本 job 的用途：真实启动腿注入 ETCD_ENDPOINTS 后，main.rs 的 etcd 装配臂
      # （assemble_coordination / EtcdWorkerAllocator / 健康监控）与 EtcdClientWrapper 的
      # 真实 I/O（connect/ping/kv/lease grant/revoke）才会被执行并计入覆盖率；
      # 缺服务时 fail-closed 会直接拒绝启动，组合根覆盖率会掉回单机臂。
      # 镜像用 bitnamilegacy/etcd：bitnami 于 2025-08 收缩 Docker Hub 免费位，
      # bitnami/etcd:3.5 已返 404（health-check.yml 的 etcd job 因此连续红）。
      etcd:
        image: bitnamilegacy/etcd:3.5
        env:
          ALLOW_NONE_AUTHENTICATION: "yes"
          ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
        ports:
          - 2379:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-ci-${{ matrix.feature }}"
          cache-targets: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Build (feature=${{ matrix.feature }})
        run: |
          if [ "${{ matrix.feature }}" = "all" ]; then
            cargo build --package ${{ env.PKG }} --all-features
          else
            cargo build --package ${{ env.PKG }}
          fi

      # all leg：只验证全特性面的编译与测试执行，不进覆盖率门禁
      # （sdk 代码测试密度低，95% 阈值会挂；与旧独立 sdk job 的策略一致）。
      - name: Run Tests (feature=all)
        if: matrix.feature == 'all'
        run: cargo test --package ${{ env.PKG }} --all-features --no-fail-fast

      - name: Run operator member tests (default leg only)
        # workspace 成员测试单独成步：nebulaid-operator 的 CRD/择优/状态回写单测
        # （4 用例）在 default leg 执行；不进覆盖率分母——其 reconcile/patch_status/
        # owner-watch 路径依赖真实 apiserver，单机不可达，纳入 95% 行覆盖率口径
        # 会把主 crate 的真实门槛稀释成不可信数字（显式排除，非默认遗漏）。
        if: matrix.feature == 'default'
        run: cargo test --package nebulaid-operator

      # default leg：覆盖率门禁（≥95%）与 Codecov 上报只在 default 跑。
      # 覆盖口径只含主 crate（--package ${{ env.PKG }}）：nebulaid-operator 显式排除，
      # 理由同上（kube API 面单机不可测）。gate job 对 workspace 的成立性由
      # fmt-clippy 的成员 lint 腿 + 本 leg 的成员测试步共同保证。
      # 采集分两步累积 profraw 再合并出报告：
      #  (1) cargo llvm-cov --no-report：单元/集成测试覆盖 lib 与各 handler；
      #  (2) cargo llvm-cov --no-report run --bin nebula-id：真实启动服务端（连上方
      #      postgres/redis 服务、跑迁移、装载 API key、起 HTTP+gRPC），健康就绪后
      #      SIGTERM 优雅停机，覆盖 main.rs 组合根（init_*/run_servers/shutdown_signal）
      #      —— 这些代码 `cargo test` 结构上无法执行，只有跑真实二进制才命中。
      # 阈值仍 95%；--ignore-filename-regex 仅排除 prost/tonic 生成的 proto 胶水，
      # main.rs 等手写代码全量计入（现经真实启动覆盖）。
      - name: Collect coverage (tests + live server boot), enforce ≥95%
        if: matrix.feature == 'default'
        env:
          NEBULA_ENV: development
          NEBULA_DATABASE_PASSWORD: idgen
          NEBULA_API_KEY_SALT: ci-coverage-salt-0123456789
          NEBULA_ADMIN_API_KEY_ID: ciadmin
          NEBULA_ADMIN_API_KEY_SECRET: ci-admin-secret-0123456789
        run: |
          set -uo pipefail
          ETCD_TEST_ENDPOINTS=http://127.0.0.1:2379
          export ETCD_TEST_ENDPOINTS
          # (1) 测试覆盖（累积 profraw，先不出报告）；测试失败即终止
          cargo llvm-cov --no-report --package ${{ env.PKG }} || { echo "::error::单元/集成测试未通过"; exit 1; }
          # (2) 真实 etcd 上的协调回归（lease grant → keep_alive → release/revoke + 锁互斥）：
          # 这些用例的 etcd.rs 真实 I/O 在 mock 面不可达，只能走真集群；按 §4
          # “不降门槛、只补测”的原则用本 job 的 etcd 服务补齐，而不是加豁免。
          # 关键：不开 `--features integration-tests`——那会多编译 414 行永不执行的
          # DB 用例体入分母（实测 94.56% → 93.64%）；改用与 (1) 完全相同的默认特性。
          cargo llvm-cov --no-report --package ${{ env.PKG }} --lib -- \
            --ignored integration_ --test-threads=1 \
            || { echo "::error::真实 etcd 集成用例未通过"; exit 1; }
          # 编译先行（前台）：llvm-cov run 的冷编译可达 2 分钟，若让它在轮询
          # 窗口内并行进行，120s 就绪窗会被编译期吃掉（runner 波动下必现假失败）。
          ETCD_ENDPOINTS=http://127.0.0.1:2379 cargo llvm-cov --no-report run --bin nebula-id -- --help >/dev/null 2>&1 || true
          # (3) 真实启动二进制覆盖组合根（注入 ETCD_ENDPOINTS：默认产物含 etcd 后，
          # 启动必须走 etcd 协调臂而不是单机本地锁臂，同时把 EtcdClientWrapper 的
          # connect/ping/kv/lease grant/keepalive/revoke 真实 I/O 臂计入覆盖）
          ETCD_ENDPOINTS=http://127.0.0.1:2379 cargo llvm-cov --no-report run --bin nebula-id -- --config config/config.toml &
          SERVER_PID=$!
          healthy=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::nebula-id 未在 120s 内就绪，无法采集组合根覆盖率"
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          pkill -TERM -f 'config/config.toml' || true
          wait "$SERVER_PID" 2>/dev/null || true
          # (4) 合并三轮 profraw 出 lcov 并强制 95% 行覆盖率门禁。
          # 加 --summary-only：使百分比在 job 日志里可直接审计（原先只写 lcov 不落屏幕，
          # 腿红掉时看不到真实数字，只能盲猜差多少行）；阈值与口径不变。
          cargo llvm-cov report --package ${{ env.PKG }} \
            --ignore-filename-regex "server/proto/" \
            --fail-under-lines 95 --summary-only --lcov --output-path lcov.info

      - name: Upload Coverage Report
        if: always() && matrix.feature == 'default'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.feature }}
          verbose: true

  # 阶段 5：聚合门禁（任一前置 job 失败则阻断合并）
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [fmt-clippy, deny, audit, test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "fmt-clippy: ${{ needs.fmt-clippy.result }}"
          echo "deny:      ${{ needs.deny.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "test:      ${{ needs.test.result }}"
          if [[ "${{ needs.fmt-clippy.result }}" != "success" || \
                "${{ needs.deny.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed - blocking merge"
            exit 1
          fi
          echo "All CI gates passed"
