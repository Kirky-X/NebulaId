name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nebula-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 预检：检测 secrets 是否存在（GitHub Actions 不能直接在 if 里比较 secrets）
  check-secrets:
    name: Check Registry Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_cargo_token: ${{ steps.check.outputs.has_cargo_token }}
      has_npm_token: ${{ steps.check.outputs.has_npm_token }}
    steps:
      - name: Detect registry tokens
        id: check
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "has_cargo_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_cargo_token=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_npm_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm_token=false" >> $GITHUB_OUTPUT
          fi

  # LOW-4 修复（CWE-1357）：发布前强制安全审查门禁。
  # 规则 19 要求「发布前强制安全审查」——任何 tag 发布前必须通过
  # cargo-audit（RustSec advisory-db）+ cargo-deny（许可证/重复依赖/ban）。
  # 任一失败立即阻断发布流水线，禁止打 tag 后绕过审查。
  #
  # SEC-LOW-004 修复（CWE-1357 mutable action tags）：使用 major version
  # tag（`@v4` / `@stable` / `@v2`）而非 SHA pin。决策权衡：
  # - SHA pin：安全性最高（防止 action 仓库被攻陷后注入恶意代码），
  #   但维护成本高（每次升级需手动更新 SHA，且 dependabot 自动升级
  #   也只是把 SHA 替换为新 SHA，PR 审查负担重）。
  # - major version tag：GitHub 官方推荐做法，由 action owner 维护
  #   tag 指向最新 patch release。配合 `.github/dependabot.yml` 的
  #   `github-actions` ecosystem 配置，自动升级到最新 minor/patch。
  # - 折中：本流水线使用 major version tag + dependabot 自动升级，
  #   平衡安全性与可维护性。如未来安全要求升级，可改为 SHA pin。
  pre-release-audit:
    name: Pre-release Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (--deny warnings)
        run: cargo audit --deny warnings

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn

  # 发布到 crates.io：凭证走 OIDC trusted publishing（rust-lang/crates-io-auth-action），
  # 不依赖 CARGO_REGISTRY_TOKEN。此前用 has_cargo_token 门控会在 secret 缺失时
  # 静默 skip 发布（tag 打了但 crates.io 没动），故取消门控让失败显性暴露。
  publish-cargo:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-release-audit]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-publish"
          cache-targets: false

      - name: Validate Package
        # 与 ci.yml 口径一致：--all-features 可构建（sqlite feature 已删除），
        # 发布前以最大特性集验证包完整性
        run: cargo check --package nebulaid --all-features

      - name: Assert operator member is excluded from publishing
        # workspace 化后发布链只发主 crate：nebulaid-operator 成员在
        # crates/nebulaid-operator/Cargo.toml 声明 publish = false，crates.io
        # 发布面必须显式拒绝它——此处以 dry-run 反向断言（失败即回归），
        # 防将来有人打开该开关把 operator 误发到主 crate 版本号下。
        run: |
          set -uo pipefail
          if cargo publish --dry-run -p nebulaid-operator >/tmp/operator-dryrun.log 2>&1; then
            echo "::error::nebulaid-operator is publishable; exclusion regressed (expected publish = false)"
            cat /tmp/operator-dryrun.log
            exit 1
          fi
          cat /tmp/operator-dryrun.log
          grep -q "package.publish" /tmp/operator-dryrun.log \
            && echo "OK nebulaid-operator excluded by publish = false" \
            || { echo "::error::operator dry-run failed for an unexpected reason (not publish=false)"; exit 1; }

      - name: Dry-run package (main crate only)
        # 发布前对真正要发的包做 dry-run：从 workspace 打包成 tarball 并独立构建验证，
        # 能在 tag 前暴露 [workspace] 引入的打包面问题（漏 files/include、路径依赖越界）。
        run: cargo publish --dry-run -p nebulaid

      # 幂等:已发布版本直接跳过,避免重跑时"already exists"报错
      - name: Check already published
        id: published
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/nebulaid/${VERSION}")
          echo "nebulaid ${VERSION}: HTTP ${CODE}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # crates.io trusted publishing（OIDC）：官方 auth-action 以 Actions OIDC 换取短时发布凭证
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        # 发布使用默认特性集：下游按需叠加 etcd/sdk。
        run: cargo publish -p nebulaid
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # 发布成功后必须可在 crates.io 查询到（索引传播有延迟，轮询重试）。
      # crates.io API 强制要求 User-Agent 头，缺失时返回 403。
      - name: Verify on crates.io
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ok=""
          CODE="000"
          # 索引传播有延迟：403（要求 UA/未就绪）与 404（索引尚未刷新）都必须继续轮询，
          # 只有 200 视为成功；其余状态码视为真实失败立即退出。
          for i in $(seq 1 40); do
            sleep 30
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/nebulaid/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            case "$CODE" in
              403|404) continue ;;
              *) break ;;
            esac
          done
          if [ -z "$ok" ]; then
            echo "::error::nebulaid ${VERSION} 未出现在 crates.io（HTTP ${CODE}）"
            exit 1
          fi
          echo "crates.io 已收录 nebulaid ${VERSION} ✓"

  # GitHub Release：仅随 tag 附源码压缩包（GitHub 自动生成 Source code
  # zip/tar.gz），不构建、不上传二进制附件——二进制分发统一走 crates.io。
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pre-release-audit]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest
      - name: Derive prerelease flag
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (source archives only)
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 通知状态
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-cargo, github-release]
    if: always()
    steps:
      - name: Check Release Status
        run: |
          CARGO_STATUS="${{ needs.publish-cargo.result }}"
          GITHUB_STATUS="${{ needs.github-release.result }}"
          
          echo "================================"
          echo "  Release Pipeline Summary"
          echo "================================"
          echo ""
          echo "Cargo Publish: $CARGO_STATUS"
          echo "GitHub Release: $GITHUB_STATUS"
          echo ""
          
          if [[ "$GITHUB_STATUS" == "success" ]]; then
            echo "✅ GitHub Release created successfully!"
            echo "  - Tag: v${{ github.ref_name }}"
            echo "  - URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.ref_name }}"
          fi
          
          if [[ "$CARGO_STATUS" != "success" ]]; then
            echo "❌ Cargo publish failed or skipped"
          fi
          
          echo ""
          echo "================================"