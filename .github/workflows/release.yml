name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nebula-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 预检：检测 secrets 是否存在（GitHub Actions 不能直接在 if 里比较 secrets）
  check-secrets:
    name: Check Registry Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_cargo_token: ${{ steps.check.outputs.has_cargo_token }}
      has_npm_token: ${{ steps.check.outputs.has_npm_token }}
    steps:
      - name: Detect registry tokens
        id: check
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "has_cargo_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_cargo_token=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_npm_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm_token=false" >> $GITHUB_OUTPUT
          fi

  # LOW-4 修复（CWE-1357）：发布前强制安全审查门禁。
  # 规则 19 要求「发布前强制安全审查」——任何 tag 发布前必须通过
  # cargo-audit（RustSec advisory-db）+ cargo-deny（许可证/重复依赖/ban）。
  # 任一失败立即阻断发布流水线，禁止打 tag 后绕过审查。
  #
  # SEC-LOW-004 修复（CWE-1357 mutable action tags）：使用 major version
  # tag（`@v4` / `@stable` / `@v2`）而非 SHA pin。决策权衡：
  # - SHA pin：安全性最高（防止 action 仓库被攻陷后注入恶意代码），
  #   但维护成本高（每次升级需手动更新 SHA，且 dependabot 自动升级
  #   也只是把 SHA 替换为新 SHA，PR 审查负担重）。
  # - major version tag：GitHub 官方推荐做法，由 action owner 维护
  #   tag 指向最新 patch release。配合 `.github/dependabot.yml` 的
  #   `github-actions` ecosystem 配置，自动升级到最新 minor/patch。
  # - 折中：本流水线使用 major version tag + dependabot 自动升级，
  #   平衡安全性与可维护性。如未来安全要求升级，可改为 SHA pin。
  pre-release-audit:
    name: Pre-release Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (--deny warnings)
        run: cargo audit --deny warnings

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn

  # 发布到 crates.io（仅在 CARGO_REGISTRY_TOKEN 存在时执行，无 secret 跳过不报错）
  publish-cargo:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-secrets, pre-release-audit]
    if: needs.check-secrets.outputs.has_cargo_token == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nebula-publish"
          cache-targets: false

      - name: Validate Package
        # 与 ci.yml 口径一致：--all-features 可构建（sqlite feature 已删除），
        # 发布前以最大特性集验证包完整性
        run: cargo check --package nebulaid --all-features

      - name: Get crates.io Auth Token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        # 发布使用默认特性集：下游按需叠加 etcd/sdk
        run: cargo publish -p nebulaid
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # 发布成功后必须可在 crates.io 查询到（索引传播有延迟，轮询重试）。
      # crates.io API 强制要求 User-Agent 头，缺失时返回 403。
      - name: Verify on crates.io
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ok=""
          CODE="000"
          for i in 1 2 3 4 5; do
            sleep 20
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/nebulaid/${VERSION}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::nebulaid ${VERSION} 未出现在 crates.io（HTTP ${CODE}）"
            exit 1
          fi
          echo "crates.io 已收录 nebulaid ${VERSION} ✓"

  # GitHub Release：仅随 tag 附源码压缩包（GitHub 自动生成 Source code
  # zip/tar.gz），不构建、不上传二进制附件——二进制分发统一走 crates.io。
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pre-release-audit]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release (source archives only)
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 通知状态
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish-cargo, github-release]
    if: always()
    steps:
      - name: Check Release Status
        run: |
          CARGO_STATUS="${{ needs.publish-cargo.result }}"
          GITHUB_STATUS="${{ needs.github-release.result }}"
          
          echo "================================"
          echo "  Release Pipeline Summary"
          echo "================================"
          echo ""
          echo "Cargo Publish: $CARGO_STATUS"
          echo "GitHub Release: $GITHUB_STATUS"
          echo ""
          
          if [[ "$GITHUB_STATUS" == "success" ]]; then
            echo "✅ GitHub Release created successfully!"
            echo "  - Tag: v${{ github.ref_name }}"
            echo "  - URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.ref_name }}"
          fi
          
          if [[ "$CARGO_STATUS" != "success" ]]; then
            echo "❌ Cargo publish failed or skipped"
          fi
          
          echo ""
          echo "================================"