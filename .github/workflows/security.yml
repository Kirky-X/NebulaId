# 安全检查补充 workflow
# 由统一护栏配置生成（2026-10-20）。只包含本仓现有 CI 尚未覆盖的检查，
# 不改动既有 workflow，避免与已有 job 重复。
name: security
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks 需要全量提交历史：浅克隆（默认 depth=1）下 action 算出的
      # `<head>^..<head>` 区间取不到父提交，gitleaks 会以
      # "fatal: ambiguous argument ... unknown revision" + Unexpected exit code [1] 退出，
      # 扫描实际空转（同族 CalNexus run 39473509412 即此原因）。
      # 写法对齐 vecboost 仓同一 workflow：SHA 钉住 + fetch-depth: 0，顺带消除
      # @v4 的 Node.js 20 弃用告警与 zizmor 的 unpinned-uses。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: actionlint
        # 第三方 docker action 钉具体版本：latest 可变，上游可静默换镜像。
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # shellcheck 子检查降到 error 级：YAML 语法/表达式错误仍阻断，
          # 风格级（SC2086/SC2034 等）不阻断，避免打断既有流水线。
          args: -color -shellcheck=error
      - name: zizmor (GitHub Actions 安全审计)
        # 首轮为非阻断基线：既有 workflow 存在一批 unpinned-uses / cache-poisoning /
        # template-injection 发现，阻断式会直接打断现有流水线。backlog 清零后
        # 把 continue-on-error 删掉即可转为阻断。
        continue-on-error: true
        # 版本修正（可验证的外部事实）：`v0.12.0` 在 zizmorcore/zizmor-action 仓库不存在
        # （tags 列表最高为 v0.7.1），引用不存在的 ref 会让 job 在 "Set up job" 直接报
        # Unable to resolve action 而红；改为 SHA 钉住 v0.7.1，与本工作区 vecboost 仓已采用的写法一致。
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      - name: gitleaks 密钥扫描
        # 第三方 action 钉 SHA：可变 tag（@v2）可被上游重指，与本文件其余 action 一致。
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: trivy (文件系统/依赖漏洞)
        # 同上：@master 是可变分支，钉 v0.36.0。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
