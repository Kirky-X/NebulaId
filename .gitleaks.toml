# gitleaks 配置 —— 安全扫描误报降噪（非关闭检测）
# 用法：gitleaks detect --source . --config .gitleaks.toml
# 说明：[extend] useDefault=true 仅继承内置检测“规则”，不继承内置默认 allowlist，
# 故此处显式枚举“永不存放真实凭据”的目录级噪声路径（检测器基线自报 / vendored crate
# 缓存 / 历史扫描产物 / 测试 / 示例 / 基准 / 文档 / testdata/fixtures 夹具 / 构建产物）。
# 生产源文件(src/)内联测试夹具的零星命中，改由 .gitleaksignore 逐行指纹精确忽略，
# 保留这些文件对真实密钥的持续检出能力。

title = "NebulaId gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "目录级噪声放行：基线自报/vendored/扫描产物/测试/示例/基准/文档/testdata/fixtures/构建产物"
paths = [
    '''(^|/)\.secrets\.baseline$''',
    '''(^|/)\.cargo/registry/''',
    '''(^|/)reviews/''',
    '''(^|/)tests?/''',
    '''(^|/)examples?/''',
    '''(^|/)benches?/''',
    '''(^|/)docs?/''',
    '''(^|/)testdata/''',
    '''(^|/)fixtures?/''',
    '''_tests?\.rs$''',
    '''\.md$''',
    '''(^|/)target/''',
]
# 值锚定的内联测试夹具放行（与目录级放行、指纹清单互补的第三层）。
# 缘由：`.gitleaksignore` 的 key 是 {commit}:{file}:{rule}:{line}，一旦上方删除注释使夹具
# 行号平移（已发生：提交 1f8fc73 把 src/core/database/api_key_repository.rs 的
# generic-api-key 从 1198 行推到 1118 行，旧条目立即失效），以及浅克隆下归因 commit
# 漂移到 HEAD，都需要补新指纹。改按「已知伪造值」本身放行：跨 commit/跨行号稳定，
# 仍不放宽该文件对真实凭据的检出能力（只豁免这个字面量）。
regexes = [
    '''this_is_a_valid_secret_12345''',
]
