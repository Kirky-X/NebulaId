# Pre-commit hooks for Nebula ID Rust Project
#
# This configuration provides automatic code quality checks before commits.
# Install pre-commit: pip install pre-commit
# Install hooks: pre-commit install
# Update hooks: pre-commit autoupdate
#
# See AGENTS.md for code quality requirements.

repos:
  # Rust Code Formatting (cargo fmt)
  # 单包仓库：显式限定 nebulaid 目标包，避免全树扫描
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust Code Formatting
        description: Check code formatting with cargo fmt
        entry: bash -c 'cargo fmt --package nebulaid -- --check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Rust Static Analysis (cargo clippy)
  # 限定 --package nebulaid，避免扫描 path 依赖
  # --all-features 可构建（sqlite feature 已删除），口径与 ci.yml 一致
  - repo: local
    hooks:
      - id: cargo-clippy
        name: Rust Static Analysis
        description: Run cargo clippy for code quality analysis
        entry: bash -c 'cargo clippy --package nebulaid --all-features -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Rust Compilation Check (cargo check)
  # 限定 --package nebulaid，避免扫描 path 依赖
  # --all-features（同上）
  - repo: local
    hooks:
      - id: cargo-check
        name: Rust Compilation Check
        description: Verify project compiles without errors
        entry: bash -c 'cargo check --package nebulaid --all-features'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # === 提交完成后清理本地编译产物（post-commit 阶段；启用: pre-commit install -t post-commit） ===
  - repo: local
    hooks:
      - id: post-commit-clean
        name: clean local build artifacts (cargo target + python)
        entry: >-
          bash -c 'cargo clean >/dev/null 2>&1;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d -name target -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name "*.egg-info" \) -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type f \( -name "*.pyc" -o -name "*.pyo" \) -exec rm -f {} +;
          if [ -z "$(git ls-files build dist)" ]; then rm -rf build dist; fi;
          echo "[post-commit] 已清理 cargo target 与 Python 编译产物"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]

# Global Settings
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: '3.0.0'

# Fail fast on first error
fail_fast: true
