[package]
name = "nebulaid"
version = "0.3.0-rc.3"
description = "Enterprise-grade distributed ID generation system"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/NebulaId"
homepage = "https://github.com/Kirky-X/NebulaId"
keywords = ["distributed", "id-generator", "snowflake", "uuid"]
categories = ["development-tools", "database"]

[lib]
name = "nebulaid"
path = "src/lib.rs"

[[bin]]
name = "nebula-id"
path = "src/main.rs"
required-features = ["server"]

# 集成测试引用 server 门控面，required-features 使剪裁组合自动跳过而非编译失败。
[[test]]
name = "i18n_e2e"
path = "tests/i18n_e2e.rs"
required-features = ["server"]

[[test]]
name = "audit_ring_stall_repro"
path = "tests/audit_ring_stall_repro.rs"
required-features = ["server"]

[features]
# 特性模型（模块级门控）：--all-features 可构建；--no-default-features 为有效轻量目标（未启用模块经 cfg 门控排除）。
default = ["server", "segment", "snowflake", "uuid-v8", "uuid-v5", "uuid-v4", "uuid-v7", "postgresql", "garrison-auth"]
postgresql = ["dbnexus/postgres"]
etcd = ["dep:etcd-client"]
# database 为仓储层开关（segment 蕴含 database）；snowflake/uuid-v* 为零 DB 叶子算法；server 为整层开关。
database = ["dep:dbnexus", "dep:sea-orm", "dep:argon2", "dep:subtle"]
segment = ["database"]
snowflake = []
uuid-v8 = []
# uuid-v5: RFC 9562 §5.5 name-based 确定性派生；零 DB 叶子特性，纯函数（无时钟/协调/状态）。
uuid-v5 = []
# uuid-v4: RFC 9562 §5.4 随机发号；零 DB 叶子特性。122 位不可猜测且完全零元数据，适合 request id/能力令牌。
uuid-v4 = []
# uuid-v7: RFC 9562 §5.7 时间有序发号；零 DB 叶子特性。时间戳可直取，无 dc/worker/shard 不泄漏部署拓扑。
uuid-v7 = []
server = ["database", "http", "grpc", "sdforge/http", "sdforge/grpc", "sdforge/openapi", "sdforge/context", "sdforge/docs", "dep:oxcache", "dep:inklog", "dep:axum", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:utoipa", "dep:limiteron", "dep:tokio-stream", "dep:metrics-exporter-prometheus"]
# alerting: 门控告警子系统（AlertManager/规则/状态机/通知通道/broadcast）与 webhook 分发；默认不含以缩小产物。
alerting = ["dep:reqwest"]
# integration-tests: 门控需要真实数据库的 #[ignore] 集成测试
integration-tests = []
# sdforge 宏 emit 的 cfg 镜像 feature；缺 openapi 时 #[forge] 不注册 OpenAPI 路由（paths 为空）。
http = []
grpc = []
openapi = []
# garrison-auth: 门控 garrison 集成（认证防爆破 BruteForceStrategy + 进程内 DAO/BoundedDao）。
garrison-auth = ["dep:garrison"]
# sdk: 门控嵌入式 SDK facade（src/sdk/）；蕴含 openapi，不蕴含 database；不开 sdk 时依赖树零影响。
sdk = ["openapi", "dep:trait-kit"]

# sdforge 宏 emit 的其他内部 feature cfg gate，声明为已知 cfg 值以消除 check-cfg 警告。
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("http", "grpc", "cli", "mcp", "openapi", "websocket", "streaming", "cache", "logging", "inklog", "i18n", "security", "ratelimit", "ratelimit-http", "docs", "lifecycle", "limiteron-integration", "kit"))',
] }

[dependencies]
# 自研生态（Kirky-X）：统一走 crates.io registry，不再使用兄弟仓库路径依赖，本仓库可独立构建、CI 无需 checkout 兄弟目录。
# confers: 0.6.0-rc.6 起提供 watcher::HotReloader 与 hot-reload-kit（热加载最低依赖版本）。
# toml 为 `parse_content(Format::Toml)` 的解析后端，缺省组合下仅靠传递依赖偶然启用，
# 剪裁组合（sdk+uuid-v5 等）会退化为 “Failed to parse TOML: Add toml feature”。
confers = { version = "0.6.0-rc.10", default-features = false, features = ["interpolation", "hot-reload-kit", "json", "toml"] }
oxcache = { version = "0.5.0-rc.8", optional = true, default-features = false }
# dbnexus: 不启用 migration（sqlparser 重依赖且零使用）；DDL 走 sea-orm execute_unprepared。
dbnexus = { version = "0.6.0-rc.9", optional = true, default-features = false, features = ["runtime-tokio-rustls", "with-chrono", "with-uuid"] }
sdforge = { version = "0.5.0-rc.8", default-features = false }
inklog = { version = "0.3.0-rc.9", optional = true, default-features = false, features = ["fast-masking"] }
# fast-masking: Aho-Corasick 多模式脱敏加速；凭证/密钥类日志字段自动脱敏是合规刚需，开 feature 即得。
# garrison: 同作者认证框架；rc.2 为 firewall-bruteforce 最低可用版（rc.1 编译失败），需 limiteron ^0.3.0-rc.7。
garrison = { version = "0.9.0-rc.3", optional = true, default-features = false, features = ["firewall-bruteforce"] }
# trait-kit: 模块标准接口与 Kit 能力管理中心；仅 sdk feature 拉入（dep:trait-kit），不开 sdk 依赖树零影响。
trait-kit = { version = "0.5.0-rc.9", optional = true, default-features = false, features = ["async", "lifecycle", "health"] }

# 工具
async-trait = { version = "0.1", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# 异步运行时
tokio = { version = "1.53", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", optional = true, default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# axum: 直接依赖（sdforge::axum 门面收窄）；版本须与 sdforge 内部同 minor（0.8），保证 Router 跨边界类型一致。
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "form", "matched-path", "original-uri", "query", "tokio"] }

# gRPC / Protobuf（通过 sdforge::tonic / sdforge::prost re-export使用）

# Derive 宏直接依赖：展开时生成 ::crate_name:: 绝对路径，属性宏经 #[sdforge::crate::macro] 调用。
utoipa = { version = "6.0", optional = true, default-features = false, features = ["macros", "uuid", "chrono"] }
prost = { version = "0.14", optional = true, default-features = false, features = ["derive"] }
sea-orm = { version = "2.0", optional = true, default-features = false, features = ["macros", "with-json", "with-uuid", "with-chrono"] }
tonic-prost = { version = "0.14", optional = true, default-features = false }
# tonic: 直接依赖仅为启用 tls 特性（sdforge 的 tonic 未开）；版本须与 sdforge 内部一致（0.14）。
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "tls-ring"] }

# 分布式协调
etcd-client = { version = "0.21", optional = true, default-features = false, features = ["tls"] }

# 缓存与存储
parking_lot = { version = "0.12", default-features = false }

# 日志追踪（tracing-subscriber 由 inklog 间接引入，日志初始化通过 inklog 接管）
tracing = { version = "0.1", default-features = false, features = ["std"] }

# metrics: /metrics 经 exporter 自有 registry 渲染既有原子快照（generate 热路径零改动）；不自起监听器。
metrics = { version = "0.24", default-features = false }
metrics-exporter-prometheus = { version = "0.18", optional = true, default-features = false }

# 工具库
# uuid: v5 无条件开在依赖面（使用侧经 uuid-v5 门控）；与消费方 Uuid::new_v5 同 crate 同版本，保证派生数值逐位兼容。
uuid = { version = "1.26", default-features = false, features = ["std", "v4", "v7", "v8", "v5", "serde"] }
# chrono: AuditEvent 的 serde 派生含 DateTime<Utc> 字段；sea-orm 转 optional 后须显式声明。
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
subtle = { version = "2.6", optional = true, default-features = false, features = ["std"] }
# argon2: API key 密钥哈希（CWE-916 修复）；0.6 起 std 废弃，OsRng 由 getrandom feature 提供。
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc", "password-hash", "getrandom"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
# validator 经 sdforge::validator re-export 消费（http 门控且本 crate 恒开），不列直接依赖。
serde_with = { version = "3.23", default-features = false, features = ["std", "macros"] }

# 错误处理

# 加密
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }

# 基础组件
arc-swap = { version = "1.9", default-features = false }
smallvec = { version = "1.16", default-features = false, features = ["const_generics"] }
url = { version = "2.5", default-features = false, features = ["std"] }

# 速率限制和流量控制
# limiteron: 只消费 core 原语，postgres/quota-control/ban-manager 等 feature 全仓零使用不启用。
limiteron = { version = "0.3.0-rc.7", optional = true, default-features = false }

# sys-locale: 系统语言自动探测（检测链见 main.rs）；FTL 资源编译期内嵌，icu 按需不引入（消息纯文本插值）。
sys-locale = { version = "0.3", default-features = false }

[dev-dependencies]
mockall = { version = "0.15", default-features = false }
sea-orm = { version = "2.0", default-features = false, features = ["mock"] }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
criterion = { version = "0.8", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# toml 仅用于测试中序列化 Config 为 TOML 字符串（confers 不提供序列化功能）
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }

[[bench]]
name = "i18n"
harness = false
required-features = ["server"]

[[bench]]
name = "algorithms"
harness = false
required-features = ["server", "garrison-auth"]

[[bench]]
name = "auth_cache_adoption"
harness = false
required-features = ["server", "garrison-auth"]

# SDK 示例：仅启用 sdk 特性时构建（引用被 cfg 门控的 nebulaid::sdk），未启用时 cargo build/test 跳过。
[[example]]
name = "embedded"
required-features = ["sdk"]

[[example]]
name = "sdk_server"
required-features = ["sdk", "http"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0

[profile.bench]
opt-level = 3
lto = true
