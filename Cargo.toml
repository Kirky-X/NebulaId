[package]
name = "nebulaid"
version = "0.2.0"
description = "Enterprise-grade distributed ID generation system"
authors = ["Kirky.X"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kirky-X/NebulaId"
homepage = "https://github.com/Kirky-X/NebulaId"
keywords = ["distributed", "id-generator", "snowflake", "uuid"]
categories = ["development-tools", "database"]

[lib]
name = "nebulaid"
path = "src/lib.rs"

[[bin]]
name = "nebula-id"
path = "src/main.rs"

[features]
default = ["postgresql", "http", "grpc", "garrison-auth"]
postgresql = ["dbnexus/postgres"]
# sqlite: 当前不可构建（保留定义但不受支持，勿在 CI/文档中启用）。
# 原因是必然的后端混用：default 恒含 postgresql → dbnexus/postgres 恒被启用，
# 只要再开 sqlite 就同时命中 dbnexus/sqlite + dbnexus/postgres，
# 触发 dbnexus/src/lib.rs 的 compile_error!("Cannot mix embedded
# (sqlite/duckdb) and server-side (postgres/mysql) database features")。
# 同理 --all-features 不可用：本项目可构建的最大集合是 default + etcd。
# （limiteron 已不再传递启用 dbnexus/postgres —— 其 postgres feature 全仓
# 零使用，依赖面已解耦；sqlite 不可构建纯因上述 default 后端混用。）
sqlite = ["dbnexus/sqlite"]
etcd = ["dep:etcd-client"]
# integration-tests: 门控需要真实数据库的 #[ignore] 集成测试
integration-tests = []
# sdforge 宏在 #[forge] 展开时 emit #[cfg(feature = "http"/"grpc"/"openapi")]，
# 这里声明空镜像 feature 使其在 nebulaid crate 上下文中求值为 true。
# 缺 openapi 镜像 feature 时，#[forge] 的 OpenAPI 路由信息不注册，
# /api-docs/openapi.json 的 paths 为空。
http = []
grpc = []
openapi = []
# garrison-auth: 启用 garrison 接管 API key 验证（替代手写 Argon2id + key_id:key_secret 方案）
garrison-auth = ["dep:garrison"]
# sdk: 门控嵌入式 SDK facade（src/sdk/，Kit 范式装配）。
# 引入 trait-kit（async/lifecycle/health）：SDK 以 AsyncKit 模块化装配
# （分布式锁/仓储/路由/ID 生成四模块），依赖图由 kit.build() 校验，
# 取代手写顺序装配。不开 sdk 的构建不含 trait-kit（依赖树零影响）。
# 蕴含 openapi：SDK 示例（sdk_server）需产出含路径的 OpenAPI 文档。
sdk = ["openapi", "dep:trait-kit"]

# sdforge 宏还 emit 其他内部 feature 的 cfg gate，声明为已知 cfg 值以消除 check-cfg 警告
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("http", "grpc", "cli", "mcp", "openapi", "websocket", "streaming", "cache", "logging", "inklog", "i18n", "security", "ratelimit", "ratelimit-http", "docs", "limiteron-integration", "kit"))',
] }

[dependencies]
# 外部组件（基础设施层）
confers = "0.5"
oxcache = "0.4"
dbnexus = { version = "0.5", default-features = false, features = ["runtime-tokio-rustls", "with-chrono", "with-uuid"] }
sdforge = { version = "0.5.0-rc.1", default-features = false, features = ["http", "grpc", "openapi"] }
inklog = { version = "0.3.0-rc.1", default-features = false }
# garrison: 一站式身份认证框架（同作者 Kirky-X），通过 garrison-auth feature 启用，
# 接管 API key 验证。仅启用 web-axum（中间件）+ protocol-apikey（ApiKeyHandler）+ cache-memory（KV 后端）
# 技术债：garrison 0.8.x 内部固定旧版 confers 0.4 / oxcache 0.3 / sdforge 0.4 /
# inklog 0.1（与本 crate 的 0.5/0.4/0.5-rc/0.3-rc 并存，类型不跨边界）——
# 这些传递版本只能随 garrison 自身升级收敛，勿在本仓尝试对齐。
garrison = { version = "0.8", optional = true, default-features = false, features = ["web-axum", "protocol-apikey", "cache-memory"] }
# trait-kit: 模块定义标准接口与 Kit 能力管理中心（同作者自研生态，
# garrison/limiteron/dbnexus/sdforge 均提供 trait-kit 集成面）。
# RC 期精确 minor 锁定 0.5.0-rc.1（与 sdforge 0.5.0-rc.1 同一 RC 生态）；
# 正式版发布后按 semver 上浮（Cargo.toml 注释注明，勿提前放宽）。
# 仅 sdk feature 拉入（dep:trait-kit）：不开 sdk 的构建依赖树零影响。
trait-kit = { version = "0.5.0-rc.1", optional = true, default-features = false, features = ["async", "lifecycle", "health"] }

# 工具
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步运行时
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Web 框架：axum 直接依赖（0.5.0-rc.1 的 sdforge::axum 精选门面收窄，
# 不再导出 body::to_bytes/extract::State/routing::delete/http::* 等；
# tower/tower-http/tonic/prost/utoipa 仍走 sdforge 整体 re-export）。
# 版本必须与 sdforge 内部 axum 同 minor（0.8），保证 Router 跨边界类型一致。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "matched-path", "original-uri", "query", "tokio"] }

# gRPC / Protobuf（通过 sdforge::tonic / sdforge::prost re-export使用）

# Derive 宏直接依赖：展开时生成 `::crate_name::` 绝对路径，必须是直接依赖。
# 属性宏通过 `#[sdforge::crate::macro]` 调用，不受 extern prelude 限制。
utoipa = { version = "5.0", default-features = false, features = ["macros", "uuid", "chrono"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-json", "with-uuid", "with-chrono"] }
tonic-prost = { version = "0.14", default-features = false }
# 直接依赖 tonic：仅为启用 `tls` 特性（sdforge 的 tonic 未开该特性，
# transport::{Certificate, Identity, ServerTlsConfig} 被特性门控）。
# 特性联合使 sdforge::tonic 指向同一构建体，版本须与 sdforge 内部一致（0.14）。
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring"] }

# 分布式协调
etcd-client = { version = "0.20", optional = true }

# 缓存与存储
parking_lot = "0.12"

# 日志追踪（tracing-subscriber 由 inklog 间接引入，日志初始化通过 inklog 接管）
tracing = "0.1"

# 工具库
uuid = { version = "1.22", features = ["v4", "v7", "v8", "serde"] }
chrono = { version = "0.4", features = ["std"] }
hex = "0.4"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
subtle = "2.5"
# Argon2id 用于 API key 密钥哈希（CWE-916 修复）；0.6 起 std 废弃，salt 的
# OsRng 由 getrandom feature 提供
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
regex = "1.0"
reqwest = { version = "0.13", features = ["json"] }
validator = { version = "0.21", features = ["derive"] }
serde_with = "3.0"

# 错误处理
anyhow = "1.0"

# 加密
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.0"

# 基础组件
arc-swap = "1.6"
smallvec = "1.0"
url = "2.0"

# 速率限制和流量控制
# 注：postgres / quota-control / ban-manager features 全仓零使用（只消费
# core 的 TokenBucketLimiter / ConcurrencyLimiter / Limiter 原语），不启用——
# 这同时解除了 limiteron → dbnexus ^0.4 的传递约束（postgres feature 是
# optional dbnexus 的开关）。
limiteron = { version = "0.2", default-features = false }

# 国际化（default-features = false 禁用 accept-language，项目自带更严格的 RFC 7231 解析）
rust-i18n = { version = "4.2", default-features = false }

[dev-dependencies]
mockall = "0.15"
sea-orm = { version = "2.0", default-features = false, features = ["mock"] }
tempfile = "3.0"
reqwest = { version = "0.13", features = ["json"] }
criterion = { version = "0.8", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# toml 仅用于测试中序列化 Config 为 TOML 字符串（confers 不提供序列化功能）
toml = { version = "1.1", default-features = false, features = ["std", "serde"] }

[[bench]]
name = "i18n"
harness = false

# SDK 示例 —— 仅启用 `sdk` 特性时构建（示例引用被 #[cfg(feature = "sdk")]
# 门控的 `nebulaid::sdk`）。未启用时 `cargo build`/`cargo test` 跳过它们。
[[example]]
name = "embedded"
required-features = ["sdk"]

[[example]]
name = "sdk_server"
required-features = ["sdk", "http"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0

[profile.bench]
opt-level = 3
lto = true

# sdforge 0.5.0-rc.1 / inklog 0.3.0-rc.1 已发布到 crates.io，直接引用 registry
# 版本（曾以 [patch.crates-io] 指向 ../sdforge、../inklog 工作副本，会破坏无
# 兄弟目录环境的构建；正式版发布后按 semver 上浮）。
