[package]
name = "nebulaid"
version = "0.2.0"
description = "Enterprise-grade distributed ID generation system"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/NebulaId"
homepage = "https://github.com/Kirky-X/NebulaId"
keywords = ["distributed", "id-generator", "snowflake", "uuid"]
categories = ["development-tools", "database"]

[lib]
name = "nebulaid"
path = "src/lib.rs"

[[bin]]
name = "nebula-id"
path = "src/main.rs"

[features]
# 特性模型（2026-09 起）：
# - `--all-features` 可构建（= default + etcd + alerting + sdk +
#   integration-tests + openapi）。dbnexus 的 embedded/server 互斥不再被触发：
#   sqlite feature 已删除，dbnexus/postgres 仅由本清单的 postgresql 声明控制。
# - `--no-default-features` 是有效的轻量编译检查目标：postgres 驱动可关，
#   garrison 回退路径与 sdforge 镜像 feature（http/grpc/openapi）关闭路径全部
#   参与编译（CI fmt-clippy job 钉住该组合）。该组合仅保证编译——
#   core::database 无条件参与编译，运行时需自备 PostgreSQL。
default = ["postgresql", "http", "grpc", "garrison-auth"]
postgresql = ["dbnexus/postgres"]
etcd = ["dep:etcd-client"]
# alerting: 门控告警子系统(src/core/monitoring 的 AlertManager/AlertRule/
# 告警状态机/通知通道/broadcast 事件流)。生产路径零引用,默认不含以缩小
# 产物;test 构建恒包含(机制见 monitoring/core.rs 头注释)。
alerting = []
# integration-tests: 门控需要真实数据库的 #[ignore] 集成测试
integration-tests = []
# sdforge 宏在 #[forge] 展开时 emit #[cfg(feature = "http"/"grpc"/"openapi")]，
# 这里声明空镜像 feature 使其在 nebulaid crate 上下文中求值为 true。
# 缺 openapi 镜像 feature 时，#[forge] 的 OpenAPI 路由信息不注册，
# /api-docs/openapi.json 的 paths 为空。
http = []
grpc = []
openapi = []
# garrison-auth: 启用 garrison 接管 API key 验证（替代手写 Argon2id + key_id:key_secret 方案）
garrison-auth = ["dep:garrison"]
# sdk: 门控嵌入式 SDK facade（src/sdk/，Kit 范式装配）。
# 引入 trait-kit（async/lifecycle/health）：SDK 以 AsyncKit 模块化装配
# （分布式锁/仓储/路由/ID 生成四模块），依赖图由 kit.build() 校验，
# 取代手写顺序装配。不开 sdk 的构建不含 trait-kit（依赖树零影响）。
# 蕴含 openapi：SDK 示例（sdk_server）需产出含路径的 OpenAPI 文档。
sdk = ["openapi", "dep:trait-kit"]

# sdforge 宏还 emit 其他内部 feature 的 cfg gate，声明为已知 cfg 值以消除 check-cfg 警告
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("http", "grpc", "cli", "mcp", "openapi", "websocket", "streaming", "cache", "logging", "inklog", "i18n", "security", "ratelimit", "ratelimit-http", "docs", "limiteron-integration", "kit"))',
] }

[dependencies]
# 自研生态（Kirky-X）：统一走 crates.io registry（与 garrison/sdforge 等同一
# RC 波次），不再使用 ../base、../garrison 兄弟仓库路径依赖——本仓库可独立
# 构建，CI 无需 checkout 兄弟目录。pre-release 语义下 req 下界即各库当前
# 最新发布版，后续小版本按 semver 自动上浮。
confers = { version = "0.6.0-rc.5", features = ["interpolation", "watch"] }
oxcache = { version = "0.5.0-rc.4" }
dbnexus = { version = "0.6.0-rc.5", default-features = false, features = ["runtime-tokio-rustls", "with-chrono", "with-uuid"] }
sdforge = { version = "0.5.0-rc.4", default-features = false, features = ["http", "grpc", "openapi", "context", "docs"] }
inklog = { version = "0.3.0-rc.5", default-features = false, features = ["fast-masking"] }
# fast-masking：Aho-Corasick 多模式脱敏加速（凭证/密钥类日志字段的
# 自动脱敏是本服务合规刚需；开 feature 即得，无接线代码）
# garrison: 一站式身份认证框架（同作者 Kirky.X），通过 garrison-auth feature 启用，
# 接管 API key 验证。仅启用 web-axum（中间件）+ protocol-apikey（ApiKeyHandler）+ cache-memory（KV 后端）。
# 0.9.0-rc.1 起内部与本项目同一 RC 波次（confers 0.6.0-rc.5 / oxcache 0.5.0-rc.4 /
# sdforge 0.5.0-rc.4 / inklog 0.3.0-rc.5），旧 0.8.x 的类型不跨边界技术债已随升级收敛。
garrison = { version = "0.9.0-rc.1", optional = true, default-features = false, features = ["web-axum", "protocol-apikey", "cache-memory"] }
# trait-kit: 模块定义标准接口与 Kit 能力管理中心（同作者自研生态，
# garrison/limiteron/dbnexus/sdforge 均提供 trait-kit 集成面）。
# 锁定 0.5.0-rc.6（与 confers 0.6.0-rc.5 / garrison 0.9.0-rc.1 同一 RC 生态）；
# 正式版发布后按 semver 上浮。
# 仅 sdk feature 拉入（dep:trait-kit）：不开 sdk 的构建依赖树零影响。
trait-kit = { version = "0.5.0-rc.6", optional = true, default-features = false, features = ["async", "lifecycle", "health"] }

# 工具
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步运行时
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Web 框架：axum 直接依赖（0.5.0-rc.4 的 sdforge::axum 精选门面收窄，
# 不再导出 body::to_bytes/extract::State/routing::delete/http::* 等；
# tower/tower-http/tonic/prost/utoipa 仍走 sdforge 整体 re-export）。
# 版本必须与 sdforge 内部 axum 同 minor（0.8），保证 Router 跨边界类型一致。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "matched-path", "original-uri", "query", "tokio"] }

# gRPC / Protobuf（通过 sdforge::tonic / sdforge::prost re-export使用）

# Derive 宏直接依赖：展开时生成 `::crate_name::` 绝对路径，必须是直接依赖。
# 属性宏通过 `#[sdforge::crate::macro]` 调用，不受 extern prelude 限制。
utoipa = { version = "5.5", default-features = false, features = ["macros", "uuid", "chrono"] }
# Swagger UI 静态资源（吸收 sdforge `docs` feature 的 UI 面，见 server/swagger_ui.rs）：
# 已发布的 sdforge 0.5.0-rc.4 仅有 swagger_ui_router()——它会在
# /api-docs/openapi.json 注册 sdforge 自有 inventory 聚合 spec，与本服务自有
# spec 端点同路径冲突（Router::merge panic），故 UI 路由本地装配、spec 复用本服务端点。
utoipa-swagger-ui = { version = "9.0", default-features = false, features = ["axum"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-json", "with-uuid", "with-chrono"] }
tonic-prost = { version = "0.14", default-features = false }
# 直接依赖 tonic：仅为启用 `tls` 特性（sdforge 的 tonic 未开该特性，
# transport::{Certificate, Identity, ServerTlsConfig} 被特性门控）。
# 特性联合使 sdforge::tonic 指向同一构建体，版本须与 sdforge 内部一致（0.14）。
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring"] }

# 分布式协调
etcd-client = { version = "0.20", optional = true }

# 缓存与存储
parking_lot = "0.12"

# 日志追踪（tracing-subscriber 由 inklog 间接引入，日志初始化通过 inklog 接管）
tracing = "0.1"

# 指标（metrics facade + Prometheus 文本 exporter）：
# /metrics 渲染路径把既有原子快照灌入 exporter 自有 registry（见
# router.rs PrometheusMetricsBridge），generate 热路径零改动。
# http-listener/push-gateway 不启用——指标经本服务自身 HTTP 端点暴露，
# 不另起监听器。
# metrics 0.24 起无任何 feature 开关（facade 本体），default-features = false 为显式表态。
metrics = { version = "0.24", default-features = false }
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# 工具库
uuid = { version = "1.26", features = ["v4", "v7", "v8", "serde"] }
chrono = { version = "0.4", features = ["std"] }
hex = "0.4"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
subtle = "2.6"
# Argon2id 用于 API key 密钥哈希（CWE-916 修复）；0.6 起 std 废弃，salt 的
# OsRng 由 getrandom feature 提供
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# validator: 直接依赖（0.21，与 sdforge 内部同版本，trait 不跨边界）。已发布
# 的 sdforge 0.5.0-rc.4 未提供 validator re-export（该面在 sdforge rc.5 WIP 中，
# 尚未发布）；sdforge rc.5 发布后可评估切回 sdforge::validator re-export，
# 再次移除本直接依赖。
validator = { version = "0.21", default-features = false, features = ["derive"] }
serde_with = "3.23"

# 错误处理

# 加密
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"

# 基础组件
arc-swap = "1.9"
smallvec = "1.16"
url = "2.5"

# 速率限制和流量控制
# 注：postgres / quota-control / ban-manager features 全仓零使用（只消费
# core 的 TokenBucketLimiter / ConcurrencyLimiter / Limiter 原语），不启用——
# 这同时解除了 limiteron → dbnexus ^0.4 的传递约束（postgres feature 是
# optional dbnexus 的开关）。
limiteron = { version = "0.3.0-rc.4", default-features = false }

# 国际化（统一基线 unify-rust-i18n：Fluent/ICU 栈，替换 rust-i18n YAML 后端）。
# - fluent-bundle 0.16 concurrent：Send+Sync 的 FluentBundle 双束（en/zh）可入
#   static，FTL 资源 locales/{en,zh}/messages.ftl 经 include_str! 编译期内嵌；
# - unic-langid：Fluent 束的语言标识解析；
# - sys-locale：系统语言自动探测（检测链见 main.rs resolve_locale：
#   NEBULA_LOCALE → config.app.locale → LC_ALL/LC_MESSAGES/LANG → sys-locale → en）。
# - icu 按需不引入：本项目消息均为纯文本插值（t!/translate_with_locale），
#   无数字/日期/复数/排序格式化需求（见 design.md Non-Goals）。
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"

[dev-dependencies]
mockall = "0.15"
sea-orm = { version = "2.0", default-features = false, features = ["mock"] }
tempfile = "3.27"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
criterion = { version = "0.8", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# toml 仅用于测试中序列化 Config 为 TOML 字符串（confers 不提供序列化功能）
toml = { version = "1.1", default-features = false, features = ["std", "serde"] }

[[bench]]
name = "i18n"
harness = false

[[bench]]
name = "algorithms"
harness = false

# SDK 示例 —— 仅启用 `sdk` 特性时构建（示例引用被 #[cfg(feature = "sdk")]
# 门控的 `nebulaid::sdk`）。未启用时 `cargo build`/`cargo test` 跳过它们。
[[example]]
name = "embedded"
required-features = ["sdk"]

[[example]]
name = "sdk_server"
required-features = ["sdk", "http"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0

[profile.bench]
opt-level = 3
lto = true
