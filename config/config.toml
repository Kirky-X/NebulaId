[app]
name = "nebula-id"
host = "0.0.0.0"
http_port = 8080
grpc_port = 9091
dc_id = 0
worker_id = 0

[logging]
level = "info"
format = "json"
include_location = true

[database]
engine = "postgresql"
host = "localhost"
port = 5432
database = "idgen"
username = "idgen"
password = "${NEBULA_DATABASE_PASSWORD}"
max_connections = 50
min_connections = 5
acquire_timeout_seconds = 30
idle_timeout_seconds = 300

[redis]
url = "redis://localhost:6379"
pool_size = 16
key_prefix = "nebula:id:"
ttl_seconds = 600


[algorithm]
default = "snowflake"

[algorithm.segment]
base_step = 1000
min_step = 500
max_step = 100000
switch_threshold = 0.1

[algorithm.snowflake]
datacenter_id_bits = 3
worker_id_bits = 8
sequence_bits = 10
clock_drift_threshold_ms = 1000

[algorithm.uuid_v8]
enabled = true

[monitoring]
metrics_enabled = true
metrics_path = "/metrics"
tracing_enabled = false
otlp_endpoint = ""

[rate_limit]
enabled = true
default_rps = 10000
burst_size = 100

[tls]
enabled = false
http_enabled = false
grpc_enabled = false
cert_path = ""
key_path = ""

[batch_generate]
max_batch_size = 100

[auth]
enabled = true
cache_ttl_seconds = 300
# API Key 盐值（${VAR} 展开）：生产必填，空盐/弱盐启动校验即拒绝，用高熵盐（openssl rand -hex 32）。
api_key_salt = "${NEBULA_API_KEY_SALT:}"
api_keys = []
# 密钥轮换宽限期（秒）：0 = 关闭（上一代凭证立即失效）；上限 30 天，超限启动直接拒绝（fail-fast）。
key_rotation_grace_period_seconds = 0

[etcd]
endpoints = ["http://localhost:2379"]
connect_timeout_ms = 5000
watch_timeout_ms = 5000
