[app]
name = "nebula-id"
host = "0.0.0.0"
http_port = 8080
grpc_port = 9091
dc_id = 0
worker_id = 0

[logging]
level = "info"
format = "json"
include_location = true

[database]
engine = "postgresql"
host = "localhost"
port = 5432
database = "idgen"
username = "idgen"
password = "${NEBULA_DATABASE_PASSWORD}"
max_connections = 50
min_connections = 5
acquire_timeout_seconds = 30
idle_timeout_seconds = 300

[redis]
url = "redis://localhost:6379"
pool_size = 16
key_prefix = "nebula:id:"
ttl_seconds = 600


[algorithm]
default = "snowflake"

[algorithm.segment]
base_step = 1000
min_step = 500
max_step = 100000
switch_threshold = 0.1

[algorithm.snowflake]
datacenter_id_bits = 3
worker_id_bits = 8
sequence_bits = 10
clock_drift_threshold_ms = 1000

[algorithm.uuid_v8]
enabled = true

[monitoring]
metrics_enabled = true
metrics_path = "/metrics"
tracing_enabled = false
otlp_endpoint = ""

[rate_limit]
enabled = true
default_rps = 10000
burst_size = 100

[tls]
enabled = false
http_enabled = false
grpc_enabled = false
cert_path = ""
key_path = ""

[batch_generate]
max_batch_size = 100

[auth]
enabled = true
cache_ttl_seconds = 300
# API Key 盐值：生产环境必填，请通过环境变量注入高熵盐（如 openssl rand -hex 32）。
# 占位写法与上方 database.password 的 ${VAR} 模式一致；未设置该变量时展开为空串，
# 仅适合开发/测试 —— 生产启动会因空盐/弱盐被强制校验拒绝（见 main.rs 生产盐值检查）。
api_key_salt = "${NEBULA_API_KEY_SALT:}"
api_keys = []
# 密钥轮换宽限期（秒）。0 = 关闭：轮换后上一代凭证立即失效。
# 需要"轮换不掉请求"时改为正整数（如 3600），上限 30 天，超限会被 clamp 到上限并告警。
key_rotation_grace_period_seconds = 0

[etcd]
endpoints = ["http://localhost:2379"]
connect_timeout_ms = 5000
watch_timeout_ms = 5000
