# Nebula ID 测试脚本默认配置；环境变量覆盖文件值（优先级：环境变量 > 配置文件 > 默认值）。
# 用法：复制本文件为 test_config.toml 后修改并运行测试脚本。

# API 服务器配置
[api]
# API 基础地址；环境变量 NEBULA_API_BASE 覆盖。
api_base = "http://localhost:8080"

# 认证配置
[auth]
# 认证头；环境变量 TEST_AUTH_HEADER 覆盖，格式 "Authorization: Basic <base64>"。
auth_header = ""

# 测试工作空间配置
[workspace]
# 默认测试工作空间；环境变量 TEST_WORKSPACE 覆盖。
default_workspace = "test-workspace"

# 测试参数配置
[test]
# 是否在测试后清理数据；环境变量 CLEANUP_ENABLED 覆盖。
cleanup_enabled = true

# 并发测试配置
[concurrency]
# 默认并发数
worker_count = 10
# 每个 worker 的请求数
requests_per_worker = 10

# 性能测试配置
[performance]
# 默认请求次数
request_count = 100
# 批量请求大小
batch_size = 10