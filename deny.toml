[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
# kube 4.2 / k8s-openapi 0.28 / kube-runtime 4.2（仅 crates/nebulaid-operator 成员）与主 crate
# 既有依赖树同属 Apache-2.0 / MIT / BSD 家族，已在下方 allow 清单内——无需新增表达式，
# 但须与 cargo-deny 的 workspace 视角一起验证（`cargo deny check licenses bans sources` 实测通过）。
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
crate = "nebula-core"
expression = "Apache-2.0"
license-files = [{ path = "crates/core/LICENSE", hash = 0x00000000 }]

[[licenses.clarify]]
crate = "nebula-server"
expression = "Apache-2.0"
license-files = [{ path = "crates/server/LICENSE", hash = 0x00000000 }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    # Web framework crates with multiple versions due to feature combinations
    { crate = "tower-http", version = "*", reason = "HTTP middleware extension" },
    { crate = "winnow", version = "*", reason = "Parser combinator library" },
    
    # Common dependencies with different feature requirements
    { crate = "base64", version = "*", reason = "Common dependency with different feature requirements" },
    { crate = "bitflags", version = "*", reason = "Common dependency with different feature requirements" },
    { crate = "hashbrown", version = "*", reason = "Common dependency with different feature requirements" },
    
    # Macro crates often have multiple versions
    { crate = "darling", version = "*", reason = "Macro dependency with different feature requirements" },
    { crate = "darling_core", version = "*", reason = "Macro dependency with different feature requirements" },
    { crate = "darling_macro", version = "*", reason = "Macro dependency with different feature requirements" },
    
    # Cryptography and networking crates
    { crate = "getrandom", version = "0.2", reason = "Legacy transitive copies (rand/rand_core/uuid ecosystem)" },
    { crate = "getrandom", version = "0.3", reason = "Transitive copy via tempfile/ahash ecosystem" },
    { crate = "getrandom", version = "0.4", reason = "Current generation (Argon2 salt via password-hash/phc)" },
    { crate = "rand", version = "*", reason = "Random number generation with different feature requirements" },
    { crate = "rand_core", version = "*", reason = "Random number generation dependency" },
    
    # Apple platform crates
    { crate = "core-foundation", version = "*", reason = "Apple platform dependency" },
    
    # Windows platform crates
    { crate = "windows-sys", version = "*", reason = "Windows platform dependency" },
    
    # Other common dependencies
    { crate = "heck", version = "*", reason = "Common dependency with different feature requirements" },
]

[advisories]
# Ignore known issues without current fixes.
# 只保留"当前依赖图里确实命中"的条目：失效的忽略项既会触发 cargo-deny 的
# advisory-not-detected 警告，也会让注释描述与现状不符（若将来重新引入
# 受影响版本，宁可让门禁红起来再显式评估）。
# 历史条目 RUSTSEC-2024-0449（unsafe-libyaml 维护停滞）已随 limiteron 0.3.0-rc.8 /
# confers 0.6.0-rc.11 的 serde-saphyr 迁移退图，故整条移除而非留空注释。
ignore = []

# advisories 面在本仓库由 cargo-audit 承担（`cargo audit --no-fetch --stale`，本地 advisory-db）：
# cargo-deny 的 advisories 检查每次强制 fetch 并对其 advisory-db 缓存执行 git reset --hard，
# 既被工作区回滚守卫拦截又与离线/弱网 CI 环境不兼容；两工具共享同一 RustSec 数据源，
# 漏洞判定等价（实测：656 依赖、1381 条 advisory、0 vulnerability）。
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
