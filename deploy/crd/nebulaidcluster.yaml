# NebulaIdCluster CRD：与 crates/nebulaid-operator/src/crd.rs 的 Rust 类型一一对应
# （字段名 camelCase；schema 变更必须与 crd.rs 同步，T023 的 round-trip 单测钉住序列化面）。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nebulaidclusters.nebulaid.kirky.x
spec:
  group: nebulaid.kirky.x
  scope: Namespaced
  names:
    kind: NebulaIdCluster
    listKind: NebulaIdClusterList
    plural: nebulaidclusters
    singular: nebulaidcluster
    shortNames:
      - nic
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["replicas", "datacenters", "version"]
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "每个 DC 的 NebulaId 副本数（StatefulSet replicas）"
                datacenters:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["id", "etcdEndpoints"]
                    properties:
                      id:
                        type: integer
                        minimum: 0
                        maximum: 255
                        description: "dc 位标识（号段 dc 位前缀分区，跨 DC 命名空间不重叠）"
                      etcdEndpoints:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          description: "该 DC 的 etcd 端点，如 http://etcd-a:2379"
                version:
                  type: string
                  description: "NebulaId 镜像版本（StatefulSet image tag）"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Degraded"]
                  description: "集群整体阶段（operator 回写）"
                activeDc:
                  type: integer
                  minimum: 0
                  maximum: 255
                  description: "当前承载发号流量的 DC"
                perDcHealth:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      healthy:
                        type: boolean
                endpoints:
                  type: array
                  items:
                    type: string
