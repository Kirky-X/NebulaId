# Lefthook - Git Hooks 管理器
# 安装: npm install -g @evilmartians/lefthook && lefthook install
# 文档: https://github.com/evilmartians/lefthook
#
# 所有 Rust 命令限定 --package nebulaid（单包仓库，避免全树扫描）

pre-commit:
  parallel: false
  commands:
    # 1. 格式检查
    cargo-fmt:
      tags: [rust, fmt]
      glob: "*.rs"
      run: cargo fmt --package nebulaid -- --check

    # 2. 静态分析（--all-features 不可用：dbnexus 禁止 sqlite+postgres 特性混用，
    #    compile_error! 直接编译失败；默认特性已含 postgresql/http/grpc，叠加 etcd）
    cargo-clippy:
      tags: [rust, lint]
      glob: "*.rs"
      run: cargo clippy --package nebulaid --features etcd -- -D warnings

    # 3. 私钥/密钥扫描（gitleaks）
    #    脚本抽到独立 .sh：Windows 下 lefthook 会破坏多行 `run: |` 的换行语义
    private-key-scan:
      tags: [security, secrets]
      run: bash scripts/_gitleaks_scan.sh

pre-push:
  parallel: false
  commands:
    # 1. 全特性测试（特性互斥约束同上，用 etcd 叠加而非 all-features）
    cargo-test:
      tags: [rust, test]
      run: cargo test --package nebulaid --features etcd

    # 2. 覆盖率门禁（≥80%；脚本抽到独立 .sh，原因同 pre-commit private-key-scan）
    cargo-coverage:
      tags: [rust, coverage]
      run: bash scripts/_coverage_gate.sh
