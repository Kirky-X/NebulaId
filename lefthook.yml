# Lefthook - Git Hooks 管理器
# 安装: npm install -g @evilmartians/lefthook && lefthook install
# 文档: https://github.com/evilmartians/lefthook
#
# 所有 Rust 命令限定 --package nebulaid（单包仓库，避免全树扫描）

pre-commit:
  parallel: false
  commands:
    # 1. 格式检查
    cargo-fmt:
      tags: [rust, fmt]
      glob: "*.rs"
      run: cargo fmt --package nebulaid -- --check

    # 2. 静态分析（--all-features 可构建：sqlite feature 已删除，dbnexus 的
    #    embedded/server 互斥不再触发；一条命令覆盖 etcd + sdk + alerting）
    cargo-clippy:
      tags: [rust, lint]
      glob: "*.rs"
      run: cargo clippy --package nebulaid --all-features -- -D warnings

    # 3. 私钥/密钥扫描（gitleaks）
    #    脚本抽到独立 .sh：Windows 下 lefthook 会破坏多行 `run: |` 的换行语义
    private-key-scan:
      tags: [security, secrets]
      run: bash scripts/_gitleaks_scan.sh

pre-push:
  parallel: false
  commands:
    # 1. 全特性测试（口径与 ci.yml 一致：--all-features 覆盖 etcd/sdk/alerting）
    cargo-test:
      tags: [rust, test]
      run: cargo test --package nebulaid --all-features

    # 2. 覆盖率门禁（本地口径 ≥90%：全特性 + 跳过 7 个基线失败测试，实测约
    #    93.2%；权威 95% 门禁在 ci.yml default leg。脚本抽到独立 .sh，原因同上）
    cargo-coverage:
      tags: [rust, coverage]
      run: bash scripts/_coverage_gate.sh
